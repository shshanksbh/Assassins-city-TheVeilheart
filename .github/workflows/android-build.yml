name: Build Assassin City Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          include-templates: true

      - name: Extract Assassin City
        run: |
          mkdir -p /tmp/assassin-city
          unzip -q AssassinCity_TheVeilheart_CI_READY.zip -d /tmp/assassin-city

          PROJECT_FILE=$(find /tmp/assassin-city -name project.godot -type f | head -1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: project.godot was not found."
            find /tmp/assassin-city -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Godot project:"
          echo "$PROJECT_DIR"

      - name: Check Android export preset
        run: |
          if [ ! -f "$PROJECT_DIR/export_presets.cfg" ]; then
            echo "ERROR: export_presets.cfg was not found."
            echo "The project does not currently contain an Android export preset."
            exit 1
          fi

          cat "$PROJECT_DIR/export_presets.cfg"

      - name: Import Godot project
        run: |
          godot --headless \
            --path "$PROJECT_DIR" \
            --editor \
            --quit

      - name: Find Android export preset
        run: |
          PRESET=$(python3 - "$PROJECT_DIR/export_presets.cfg" <<'PY'
import sys

path = sys.argv[1]
lines = open(path, encoding="utf-8").read().splitlines()

current_name = None

for line in lines:
    line = line.strip()

    if line.startswith("[preset."):
        current_name = None

    elif line.startswith("name="):
        current_name = line.split('"', 2)[1]

    elif line == 'platform="Android"' and current_name:
        print(current_name)
        break
PY
)

          if [ -z "$PRESET" ]; then
            echo "ERROR: No Android export preset was found."
            exit 1
          fi

          echo "ANDROID_PRESET=$PRESET" >> "$GITHUB_ENV"
          echo "Using Android preset: $PRESET"

      - name: Prepare debug keystore
        run: |
          mkdir -p "$HOME/.android"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Android APK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build"

          godot \
            --headless \
            --path "$PROJECT_DIR" \
            --export-debug "$ANDROID_PRESET" \
            "$GITHUB_WORKSPACE/build/AssassinCity.apk"

      - name: Verify APK exists
        run: |
          test -s "$GITHUB_WORKSPACE/build/AssassinCity.apk"
          ls -lh "$GITHUB_WORKSPACE/build/AssassinCity.apk"

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" \
            verify \
            --verbose \
            "$GITHUB_WORKSPACE/build/AssassinCity.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AssassinCity-Android-debug
          path: build/AssassinCity.apk
