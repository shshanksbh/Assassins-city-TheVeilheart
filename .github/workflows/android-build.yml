name: Build Assassin City Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  android-build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"

      - name: Download Godot 4.7.2
        run: |
          wget -q --show-progress \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            -O /tmp/godot.zip

          mkdir -p /tmp/godot

          unzip -q \
            /tmp/godot.zip \
            -d /tmp/godot

          chmod +x \
            /tmp/godot/Godot_v4.7.2-stable_linux.x86_64

          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 \
            --version

      - name: Install Godot Android export templates
        run: |
          mkdir -p \
            "$HOME/.local/share/godot/export_templates/4.7.2.stable"

          wget -q --show-progress \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz" \
            -O /tmp/templates.tpz

          mkdir -p /tmp/templates

          unzip -q \
            /tmp/templates.tpz \
            -d /tmp/templates

          cp -a \
            /tmp/templates/templates/. \
            "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

          echo "Installed Godot export templates:"
          ls -lh \
            "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

      - name: Extract Assassin City
        run: |
          mkdir -p /tmp/assassin-city

          unzip -q \
            AssassinCity_TheVeilheart_CI_READY.zip \
            -d /tmp/assassin-city

          PROJECT_FILE=$(find \
            /tmp/assassin-city \
            -name project.godot \
            -type f \
            | head -1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: project.godot was not found."

            find \
              /tmp/assassin-city \
              -maxdepth 4 \
              -type f

            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" \
            >> "$GITHUB_ENV"

          echo "Godot project:"
          echo "$PROJECT_DIR"

      - name: Check Android export preset
        run: |
          if [ ! -f "$PROJECT_DIR/export_presets.cfg" ]; then
            echo "ERROR: export_presets.cfg was not found."
            exit 1
          fi

          echo "Android export configuration:"

          grep -n \
            -B2 \
            -A3 \
            'platform="Android"' \
            "$PROJECT_DIR/export_presets.cfg" || true

      - name: Import and validate project
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 \
            --headless \
            --editor \
            --path "$PROJECT_DIR" \
            --quit

      - name: Find Android preset
        run: |
          PRESET=$(python3 - "$PROJECT_DIR/export_presets.cfg" <<'PY'
          import sys

          lines = open(
              sys.argv[1],
              encoding="utf-8"
          ).read().splitlines()

          name = None

          for line in lines:
              line = line.strip()

              if line.startswith("[preset."):
                  name = None

              elif line.startswith("name="):
                  name = line.split('"', 2)[1]

              elif line == 'platform="Android"' and name:
                  print(name)
                  break
          PY
          )

          if [ -z "$PRESET" ]; then
            echo "ERROR: No Android export preset found."
            exit 1
          fi

          echo "ANDROID_PRESET=$PRESET" \
            >> "$GITHUB_ENV"

          echo "Using Android preset:"
          echo "$PRESET"

      - name: Prepare debug keystore
        run: |
          mkdir -p "$HOME/.android"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" \
            >> "$GITHUB_ENV"

          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" \
            >> "$GITHUB_ENV"

          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" \
            >> "$GITHUB_ENV"

      - name: Export Assassin City APK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build"

          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 \
            --headless \
            --path "$PROJECT_DIR" \
            --export-debug "$ANDROID_PRESET" \
            "$GITHUB_WORKSPACE/build/AssassinCity.apk"

      - name: Verify APK
        run: |
          test -s "$GITHUB_WORKSPACE/build/AssassinCity.apk"

          echo "APK created successfully:"
          ls -lh "$GITHUB_WORKSPACE/build/AssassinCity.apk"

          "$ANDROID_HOME/build-tools/35.0.1/apksigner" \
            verify \
            --verbose \
            "$GITHUB_WORKSPACE/build/AssassinCity.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AssassinCity-Android-debug
          path: build/AssassinCity.apk
