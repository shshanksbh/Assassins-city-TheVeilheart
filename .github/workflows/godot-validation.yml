name: Validate Assassin City

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  godot-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget

      - name: Install Godot 4.7.2
        run: |
          wget -q \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip \
            -O /tmp/godot.zip

          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot

          mv /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 /tmp/godot/godot
          chmod +x /tmp/godot/godot

          /tmp/godot/godot --version

      - name: Extract Assassin City
        run: |
          mkdir -p /tmp/project
          unzip -q AssassinCity_TheVeilheart_CI_READY.zip -d /tmp/project

          PROJECT_FILE=$(find /tmp/project -name project.godot -type f | head -1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: project.godot was not found."
            find /tmp/project -maxdepth 3 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Found Godot project:"
          echo "$PROJECT_DIR"

      - name: Validate Godot project
        run: |
          /tmp/godot/godot \
            --headless \
            --editor \
            --path "$PROJECT_DIR" \
            --quit

      - name: Run game headless
        run: |
          timeout 20s \
            /tmp/godot/godot \
            --headless \
            --path "$PROJECT_DIR" \
            --quit-after 10
